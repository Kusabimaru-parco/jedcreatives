# Builds the site and publishes it to GitHub Pages on every push to `main`
# (or manually: Actions tab → "Deploy to GitHub Pages" → Run workflow).
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't let two deploys run at once; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Security gate: stops the deploy if an installed package has a known high/critical vulnerability.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  build:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
